<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ticket Messages</title>
  <style>
    :root {
      /* Dark Mode Elegant Palette */
      --bg-canvas: #0F0F0F;
      --bg-surface: #1A1A1A;
      --bg-elevated: #222222;
      --bg-hover: #2A2A2A;
      --bg-message-received: #252525;
      --bg-message-sent: #5B7A6B;
      --border: #333333;
      --border-subtle: #282828;
      --text-primary: #E8E8E8;
      --text-secondary: #A8A8A8;
      --text-muted: #6B6B6B;
      --accent: #5B7A6B;
      --accent-hover: #6D8E7D;
      --accent-light: rgba(91, 122, 107, 0.15);
      
      /* Status colors - Dark Mode */
      --status-open: #7B91E8;
      --status-open-bg: rgba(123, 145, 232, 0.15);
      --status-progress: #D4AA52;
      --status-progress-bg: rgba(212, 170, 82, 0.15);
      --status-resolved: #6D8E7D;
      --status-resolved-bg: rgba(109, 142, 125, 0.15);
      --status-closed: #7B7A74;
      --status-closed-bg: rgba(123, 122, 116, 0.15);
      
      /* Severity colors - Dark Mode */
      --severity-low: #6D8E7D;
      --severity-low-bg: rgba(109, 142, 125, 0.15);
      --severity-medium: #D4AA52;
      --severity-medium-bg: rgba(212, 170, 82, 0.15);
      --severity-high: #CF6D64;
      --severity-high-bg: rgba(207, 109, 100, 0.15);
      --severity-critical: #E57A70;
      --severity-critical-bg: rgba(229, 122, 112, 0.2);
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-canvas);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      color: var(--text-primary);
      font-variant-numeric: tabular-nums;
    }
    
    .header {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 56px;
      backdrop-filter: none;
    }
    
    .back-btn {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 6px 12px;
      border-radius: 8px;
      transition: all 200ms ease;
      font-weight: 500;
      letter-spacing: -0.01em;
    }
    .back-btn:hover { 
      background: var(--accent-light);
      transform: translateX(-2px);
    }
    .back-btn:before { content: '\2039'; font-size: 24px; font-weight: 300; }
    
    .header-info { flex: 1; }
    .ticket-title {
      font-size: 15px;
      font-weight: 500;
      color: var(--text-primary);
      margin-bottom: 4px;
      letter-spacing: -0.01em;
    }
    .ticket-meta {
      font-size: 12px;
      color: var(--text-secondary);
      display: flex;
      gap: 8px;
      align-items: center;
    }
    
    .status-badge, .severity-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 500;
      text-transform: capitalize;
      letter-spacing: 0.01em;
    }
    
    /* Status color coding - Dark Mode */
    .status-open {
      background: var(--status-open-bg);
      color: var(--status-open);
    }
    .status-in-progress {
      background: var(--status-progress-bg);
      color: var(--status-progress);
    }
    .status-resolved {
      background: var(--status-resolved-bg);
      color: var(--status-resolved);
    }
    .status-closed {
      background: var(--status-closed-bg);
      color: var(--status-closed);
    }
    
    /* Severity color coding - Dark Mode */
    .severity-low {
      background: var(--severity-low-bg);
      color: var(--severity-low);
    }
    .severity-medium {
      background: var(--severity-medium-bg);
      color: var(--severity-medium);
    }
    .severity-high {
      background: var(--severity-high-bg);
      color: var(--severity-high);
    }
    .severity-critical {
      background: var(--severity-critical-bg);
      color: var(--severity-critical);
      font-weight: 600;
    }
    
    .messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px 24px 20px;
      background: var(--bg-canvas);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    
    .message {
      display: flex;
      flex-direction: column;
      max-width: 70%;
      animation: messageSlideIn 0.2s ease-out;
    }
    
    .message.received {
      align-items: flex-start;
    }
    
    .message.sent {
      align-self: flex-end;
      align-items: flex-end;
    }
    
    .message-bubble {
      padding: 12px 16px;
      border-radius: 16px;
      word-wrap: break-word;
      line-height: 1.45;
      font-size: 14px;
      position: relative;
      max-width: 100%;
    }
    
    .message.received .message-bubble {
      background: var(--bg-message-received);
      color: var(--text-primary);
      border-bottom-left-radius: 4px;
      border: 1px solid var(--border-subtle);
    }
    
    .message.sent .message-bubble {
      background: var(--bg-message-sent);
      color: white;
      border-bottom-right-radius: 4px;
    }
    
    .message-author {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 4px;
      padding: 0 4px;
      letter-spacing: -0.01em;
    }
    
    .message.sent .message-author {
      display: none;
    }
    
    .message-time {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 4px;
      padding: 0 4px;
      opacity: 0.8;
    }
    
    .no-messages {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-muted);
      font-size: 14px;
    }
    
    .input-container {
      background: var(--bg-surface);
      border-top: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: flex-end;
      gap: 12px;
      min-height: 68px;
    }
    
    .message-input-wrapper {
      flex: 1;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 24px;
      display: flex;
      align-items: center;
      padding: 10px 16px;
      transition: all 200ms ease;
    }
    
    .message-input-wrapper:focus-within {
      border-color: var(--accent);
      background: var(--bg-hover);
      box-shadow: 0 0 0 3px var(--accent-light);
    }
    
    .message-input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 14px;
      font-family: inherit;
      resize: none;
      max-height: 120px;
      overflow-y: auto;
      line-height: 1.45;
      background: transparent;
      color: var(--text-primary);
    }
    .message-input::placeholder {
      color: var(--text-muted);
    }
    
    .send-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: none;
      background: var(--accent);
      color: white;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 250ms cubic-bezier(0.4, 0, 0.2, 1);
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(91, 122, 107, 0.4);
    }
    
    .send-btn:hover {
      background: var(--accent-hover);
      transform: scale(1.08) translateY(-2px);
      box-shadow: 0 6px 16px rgba(91, 122, 107, 0.5);
    }
    
    .send-btn:active {
      transform: scale(1) translateY(0);
      box-shadow: 0 2px 8px rgba(91, 122, 107, 0.4);
    }
    
    .send-btn:disabled {
      background: var(--bg-hover);
      color: var(--text-muted);
      cursor: not-allowed;
      transform: scale(1);
      box-shadow: none;
    }
    
    .send-btn:before {
      content: '\25b2';
    }
    
    .alert {
      padding: 12px 16px;
      font-size: 13px;
      text-align: center;
      animation: slideDown 0.3s;
      border-bottom: 1px solid;
    }
    .alert.error {
      background: var(--severity-high-bg);
      color: var(--severity-high);
      border-bottom-color: var(--severity-high);
    }
    
    .loading {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      font-size: 14px;
    }
    
    @keyframes messageSlideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    @keyframes slideDown {
      from { transform: translateY(-10px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    
    .messages-container::-webkit-scrollbar {
      width: 8px;
    }
    .messages-container::-webkit-scrollbar-track {
      background: transparent;
    }
    .messages-container::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }
    .messages-container::-webkit-scrollbar-thumb:hover {
      background: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="header">
    <button class="back-btn" onclick="goBack()">Tickets</button>
    <div class="header-info">
      <div class="ticket-title" id="ticket-title">Loading...</div>
      <div class="ticket-meta" id="ticket-meta"></div>
    </div>
  </div>
  
  <div id="alert" class="alert" style="display: none;"></div>
  
  <div class="messages-container" id="messages-container">
    <div class="loading">Loading messages...</div>
  </div>
  
  <div class="input-container">
    <div class="message-input-wrapper">
      <textarea id="message-input" class="message-input" placeholder="Message" rows="1" maxlength="1000"></textarea>
    </div>
    <button id="send-btn" class="send-btn" onclick="sendMessage()" disabled></button>
  </div>
  
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const ticketId = urlParams.get('ticket_id');
    const messagesContainer = document.getElementById('messages-container');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const alertEl = document.getElementById('alert');
    const ticketTitle = document.getElementById('ticket-title');
    const ticketMeta = document.getElementById('ticket-meta');
    let currentUser = null;
    let ticket = null;
    
    messageInput.addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = this.scrollHeight + 'px';
      sendBtn.disabled = !this.value.trim();
    });
    
    messageInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        if (this.value.trim()) sendMessage();
      }
    });
    
    function goBack() {
      window.location.href = '/';
    }
    
    // Get current logged-in user's email
    async function loadCurrentUser() {
      try {
        const resp = await fetch('/current_user');
        const data = await resp.json();
        if (resp.ok) {
          currentUser = data.email;
        }
      } catch (err) {
        console.error('Error loading current user:', err);
      }
    }
    
    function showAlert(message, isError = false) {
      alertEl.textContent = message;
      alertEl.className = 'alert' + (isError ? ' error' : '');
      alertEl.style.display = 'block';
      setTimeout(() => { alertEl.style.display = 'none'; }, 3000);
    }
    
    async function loadTicket() {
      try {
        const resp = await fetch(`/tickets?limit=1000`);
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.error || 'Failed to load ticket');
        ticket = data.find(t => t.ticket_id == ticketId);
        if (ticket) {
          ticketTitle.textContent = `#${ticket.ticket_id}: ${ticket.title}`;
          // Create color-coded badges for status and severity
          const statusClass = `status-${ticket.status.toLowerCase().replace(/\s+/g, '-')}`;
          const severityClass = `severity-${ticket.severity.toLowerCase()}`;
          ticketMeta.innerHTML = `
            <span class="status-badge ${statusClass}">${ticket.status}</span>
            <span class="severity-badge ${severityClass}">${ticket.severity}</span>
          `;
        } else {
          ticketTitle.textContent = `Ticket #${ticketId}`;
          ticketMeta.textContent = 'Ticket not found';
        }
      } catch (err) {
        console.error('Error loading ticket:', err);
        ticketTitle.textContent = `Ticket #${ticketId}`;
      }
    }
    
    async function loadMessages() {
      try {
        const resp = await fetch(`/tickets/${ticketId}/messages`);
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.error || 'Failed to load messages');
        
        if (data.length === 0) {
          messagesContainer.innerHTML = '<div class="no-messages">No messages yet. Start the conversation!</div>';
          return;
        }
        
        messagesContainer.innerHTML = '';
        data.forEach(msg => {
          const messageDiv = document.createElement('div');
          const isSent = currentUser && msg.author === currentUser;
          messageDiv.className = `message ${isSent ? 'sent' : 'received'}`;
          const createdAt = msg.created_at ? new Date(msg.created_at).toLocaleString() : '';
          messageDiv.innerHTML = `
            ${!isSent ? `<div class="message-author">${msg.author}</div>` : ''}
            <div class="message-bubble">${msg.message_text}</div>
            <div class="message-time">${createdAt}</div>
          `;
          messagesContainer.appendChild(messageDiv);
        });
        
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
      } catch (err) {
        messagesContainer.innerHTML = `<div class="no-messages">Error: ${err.message}</div>`;
      }
    }
    
    async function sendMessage() {
      const text = messageInput.value.trim();
      if (!text) return;
      sendBtn.disabled = true;
      messageInput.disabled = true;
      
      try {
        const resp = await fetch(`/tickets/${ticketId}/messages`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message_text: text })
        });
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.error || 'Failed to send message');
        if (!currentUser) currentUser = data.author;
        messageInput.value = '';
        messageInput.style.height = 'auto';
        await loadMessages();
        messageInput.focus();
      } catch (err) {
        showAlert(err.message, true);
      } finally {
        messageInput.disabled = false;
        sendBtn.disabled = !messageInput.value.trim();
      }
    }
    
    if (!ticketId) {
      messagesContainer.innerHTML = '<div class="no-messages">No ticket ID provided</div>';
    } else {
      // Load current user first, then load ticket and messages
      loadCurrentUser().then(() => {
        loadTicket();
        loadMessages();
      });
    }
  </script>
</body>
</html>
